<!doctype html>
<html lang="ru">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Моя коллекция</title>
        <link rel="stylesheet" href="styles.css" />
        <script src="script.js" defer></script>
    </head>
    <body>
        <header class="header">
            <h1>Манхвы</h1>
        </header>

        <main class="container">
            <p id="status" class="status">Загрузка...</p>

            <div id="cards" class="cards">
                <article class="card">
                    <img
                    class="card__image"
                    src="https://via.placeholder.com/300x200"
                    alt="Название" />
                    <div class="card__body">
                        <p class="card__text">Релиз.</p>
                        <h2 class="card__title">Название</h2>
                        <p class="card__text">Эпизоды.</p>
                        <p class="card__text">Жанры.</p>
                        <p class="card__text">Короткое описание записи.</p>
                        <div class="card__footer">
                            <span class="card__price">Автор.</span>
                            <span class="read read--no">Не прочитано</span>
                        </div>
                    </div>
                </article>
            </div>
        </main>
    </body>
</html>
